name: Static checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check timeline-v2.js
          node --check dashboard.js

      - name: Check referenced static assets
        run: |
          test -f index.html
          test -f styles.css
          test -f enhancements.css
          test -f timeline-v2.css
          test -f dashboard.css
          grep -q 'src="app.js"' index.html
          grep -q 'src="enhancements.js"' index.html
          grep -q 'src="timeline-v2.js"' index.html
          grep -q 'src="dashboard.js"' index.html
          grep -q 'href="styles.css"' index.html
          grep -q 'href="enhancements.css"' index.html
          grep -q 'href="timeline-v2.css"' index.html
          grep -q 'href="dashboard.css"' index.html
